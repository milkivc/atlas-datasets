name: Mirror to Codeberg

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  mirror:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Codeberg remote
        run: |
          git remote add codeberg git@codeberg.org:milkivc/${{ github.event.repository.name }}.git

      - name: Push to Codeberg (all branches)
        run: |
          git push --all codeberg

      - name: Push to Codeberg (tags)
        run: |
          git push --tags codeberg

      - name: Verify Codeberg sync
        run: |
          echo "✅ Successfully mirrored to Codeberg"
          echo "Codeberg Repository: https://codeberg.org/milkivc/${{ github.event.repository.name }}"
