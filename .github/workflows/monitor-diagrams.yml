name: Monitor Mermaid Diagrams

on:
  push:
    paths:
      - 'diagrams/**/*.mm'
      - 'diagrams/**/*.mermaid'
  pull_request:
    paths:
      - 'diagrams/**/*.mm'
      - 'diagrams/**/*.mermaid'

jobs:
  validate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Mermaid syntax
        run: |
          # Install mermaid-cli for validation
          npm install -g @mermaid-js/mermaid-cli
          
          # Validate all .mm files
          find diagrams -name "*.mm" -exec echo "Validating {}" ;
          find diagrams -name "*.mm" -exec mmdc -i {} -o /tmp/test.png ;
          
          echo "All Mermaid diagrams validated successfully"

      - name: Check for updates
        run: |
          # Check if README needs updating
          echo "Checking diagram documentation..."
          
          # Count diagrams
          DIAGRAM_COUNT=$(find diagrams -name "*.mm" | wc -l)
          echo "Found $DIAGRAM_COUNT Mermaid diagrams"
          
          # List all diagrams
          echo "Diagrams in repository:"
          find diagrams -name "*.mm" -exec basename {} ;

  update-documentation:
    needs: validate-diagrams
    runs-on: ubuntu-latest
    steps:
