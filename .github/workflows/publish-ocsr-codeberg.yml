name: OCSR Codeberg — Manual Validation Only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout publication material read-only
        uses: actions/checkout@v4
        with:
          ref: ocsr-codeberg-deploy
          fetch-depth: 1
          persist-credentials: false

      - name: Validate local publication package without network or secrets
        shell: bash
        run: |
          set -euo pipefail
          test -s ocsr-codeberg-site/index.html
          ! grep -RIE '(MISTRAL_API_KEY|CODEBERG_TOKEN|ZENODO_TOKEN|ORCID_TOKEN|ghp_|sk-[A-Za-z0-9])' ocsr-codeberg-site
          echo "Validation only: no repository creation, no API call, no push, no Pages publication."
          git status --porcelain
          test -z "$(git status --porcelain)"
