name: Publish All
on: workflow_dispatch
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - run: |
        $t = $env:ZENODO_TOKEN
        $repos = @("atlas-datasets","site-institucional","catalogo-operacional-milk","atlas-docs","folclore-vivo-metodologia","atlas-vivo-milk","milkivc")
        foreach ($r in $repos) {
          $b = @{
            metadata = @{
              title = "Atlas Vivo MILK - $r"
              upload_type = "dataset"
              description = "Dataset $r"
              creators = @(
                @{name="Nuno Filipe Fernandes Vieira Cabral e Araújo";orcid="0009-0004-9132-2925"},
                @{name="Eduardo Maurício Vieira Cabral e Araújo";orcid="0009-0007-6892-6570"}
              )
              resource_type = @{type="dataset";subtype="geospatial"}
              license = "CC-BY-4.0"
              version = "v1.0.0"
            }
            metadata_only = $true
          } | ConvertTo-Json -Depth 10
          $d = Invoke-RestMethod -Uri "https://zenodo.org/api/deposit/depositions" -Method Post -Body $b -Headers @{Authorization="Bearer $t";Accept="application/json"} -ContentType "application/json"
          $p = Invoke-RestMethod -Uri "https://zenodo.org/api/deposit/depositions/$($d.id)/actions/publish" -Method Post -Headers @{Authorization="Bearer $t"} -ContentType "application/json"
          Write-Host "DOI $r: $($p.doi)"
        }
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}