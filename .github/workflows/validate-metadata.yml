name: Validate Metadata

on:
  push:
    branches: [ main, master ]
    paths:
      - 'CITATION.cff'
      - 'codemeta.json'
      - 'datacite.json'
      - 'schema.org.json'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'CITATION.cff'
      - 'codemeta.json'
      - 'datacite.json'
      - 'schema.org.json'

jobs:
  validate-cff:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install cff-validator
        run: |
          pip install cff-validator

      - name: Validate CITATION.cff
        run: |
          cff-validator CITATION.cff

  validate-codemeta:
    name: Validate CodeMeta
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate codemeta.json
        run: |
          jq empty codemeta.json
          jq -e '.name' codemeta.json > /dev/null
          jq -e '.description' codemeta.json > /dev/null
          jq -e '.license' codemeta.json > /dev/null
          jq -e '.author' codemeta.json > /dev/null

  validate-datacite:
    name: Validate DataCite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate datacite.json
        run: |
          jq empty datacite.json
          jq -e '.identifier' datacite.json > /dev/null
          jq -e '.creators' datacite.json > /dev/null
          jq -e '.titles' datacite.json > /dev/null

  validate-schema-org:
    name: Validate Schema.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate schema.org.json
        run: |
          jq empty schema.org.json
          jq -e '.name' schema.org.json > /dev/null
          jq -e '.description' schema.org.json > /dev/null

  validate-fair-principles:
    name: Check FAIR Principles Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check FAIR Compliance
        run: |
          echo "=== FAIR Principles Compliance Check ==="
          
          # Findable
          if jq -e '.identifier | any(.[]; contains("doi.org"))' codemeta.json > /dev/null; then
            echo "✅ Findable: DOI found"
          else
            echo "⚠️ Findable: No DOI found"
          fi
          
          if jq -e '.author | any(.[]; .["@id"] | contains("orcid.org"))' codemeta.json > /dev/null; then
            echo "✅ Findable: ORCID found"
          else
            echo "⚠️ Findable: No ORCID found"
          fi
          
          # Accessible
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            echo "✅ Accessible: Repository is public"
          else
            echo "⚠️ Accessible: Repository is private"
          fi
          
          # Interoperable
          if [ -f "schema.org.json" ] && [ -f "datacite.json" ] && [ -f "codemeta.json" ]; then
            echo "✅ Interoperable: Multiple metadata formats found"
          else
            echo "⚠️ Interoperable: Missing metadata formats"
          fi
          
          # Reusable
          if jq -e '.license' codemeta.json > /dev/null; then
            echo "✅ Reusable: License found"
          else
            echo "⚠️ Reusable: No license found"
          fi

  validate-legal-compliance:
    name: Check Legal Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for LEGAL.md
        run: |
          if [ -f "LEGAL.md" ]; then
            echo "✅ Legal compliance document found"
          else
            echo "⚠️ No LEGAL.md file found"
          fi

      - name: Check for EUPL-1.2 License
        run: |
          if grep -q "EUPL-1.2" CITATION.cff codemeta.json datacite.json schema.org.json; then
            echo "✅ EUPL-1.2 license found in metadata"
          else
            echo "⚠️ EUPL-1.2 license not found in metadata"
          fi

      - name: Check for RGPD Compliance
        run: |
          if grep -q "RGPD\|GDPR" LEGAL.md; then
            echo "✅ RGPD compliance mentioned in LEGAL.md"
          else
            echo "⚠️ RGPD compliance not mentioned in LEGAL.md"
          fi
