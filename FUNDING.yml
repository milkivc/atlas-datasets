# --- Informações da Organização ---
organization:
  name: "Associacao MILK - Movimento de Intervencoes e Linguagens Kulturais e Arte"
  url: "https://github.com/milkivc"
  ror: "https://ror.org/05k9p4d32"
  location: "Lisboa, Portugal"
  tax_id: "518 706 451"
  legal_status: "Associacao sem fins lucrativos"
  founding_date: "2023-01-01"
  mission: |
    A Associacao MILK e uma organizacao sem fins lucrativos dedicada a preservacao,
    investigacao e promocao do patrimonio cultural imaterial portugues, com foco em
    metodologias participativas, curadoria digital e interoperabilidade de dados
    culturais e geoespaciais. O projeto Atlas Vivo MILK e o nucleo central da associacao,
    alinhado com os padroes FAIR, EUPL-1.2, e as diretrizes da Comissao Europeia para
    dados culturais e geoespaciais.

