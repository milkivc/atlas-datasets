    status: "Planned"

# --- Requisitos de Elegibilidade ---
eligibility_requirements:
  - name: "RGPD Compliance"
    description: |
      Todos os projetos da Associacao MILK estao em conformidade com o Regulamento
      Geral sobre a Protecao de Dados (RGPD) da UE, garantindo a privacidade e
      protecao de dados pessoais.
    status: "Compliant"
    certification: "Self-Assessed"

  - name: "FAIR Principles"
    description: |
      Todos os datasets e publicacoes seguem os principios FAIR (Findable, Accessible,
      Interoperable, Reusable), garantindo interoperabilidade e reutilizacao.
    status: "Compliant"
    certification: "Self-Assessed"

  - name: "EUPL-1.2 License"
    description: |
      Todos os repositorios e publicacoes da Associacao MILK usam a licenca EUPL-1.2,
      alinhada com as diretrizes da Comissao Europeia para software e dados abertos.
    status: "Compliant"
    certification: "Self-Assessed"

  - name: "ORCID Integration"
    description: |
      Todos os investigadores da Associacao MILK tem perfis ORCID, garantindo
      identificacao unica e citacao academica.
    status: "Compliant"
    certification: "Self-Assessed"

  - name: "ROR Registration"
    description: |
      A Associacao MILK esta registada no Research Organization Registry (ROR),
      garantindo identificacao unica como organizacao de investigacao.
    status: "Compliant"
    ror: "https://ror.org/05k9p4d32"

