# --- Oportunidades de Financiamento (Chamadas Abertas) ---
open_calls:
  - name: "Horizon Europe - Cluster 2: Culture, Creativity and Inclusive Society"
    url: "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home"
    description: |
      Chamadas do Horizon Europe para projetos de preservacao do patrimonio cultural,
      interoperabilidade de dados e inovacao social. A Associacao MILK esta elegivel
      para participar como coordenadora ou parceira em consorcios.
    eligibility: |
      - Organizacoes sem fins lucrativos registadas na UE
      - Alinhamento com os objetivos do Pilar 2 (Cultura e Sociedade Inclusiva)
      - Capacidade de gestao de dados FAIR e interoperabilidade
    deadline: "2026-12-31"
    budget: "Varia por chamadas (EUR 5M - EUR 20M)"

  - name: "Portugal 2030 - SIAC (Sistema de Apoio a Acoes Coletivas)"
    url: "https://www.portugal2030.pt/"
    description: |
      Financiamento para projetos de preservacao do patrimonio cultural imaterial
      em Portugal, com foco em digitalizacao, curadoria e disseminacao.
    eligibility: |
      - Associacoes registadas em Portugal
      - Projetos alinhados com a Estrategia Nacional para o Patrimonio Cultural
      - Parcerias com entidades publicas ou privadas
    deadline: "2027-06-30"
    budget: "EUR 200K - EUR 1M"

  - name: "Creative Europe - Culture Subprogramme"
    url: "https://culture.ec.europa.eu/funding/creative-europe_en"
    description: |
      Financiamento para projetos culturais transnacionais, incluindo preservacao
      digital, curadoria e disseminacao de patrimonio cultural imaterial.
    eligibility: |
      - Organizacoes culturais registadas na UE
      - Projetos com pelo menos 3 parceiros de paises diferentes da UE
      - Alinhamento com os objetivos do Creative Europe
    deadline: "2026-10-31"
    budget: "EUR 200K - EUR 2M"

  - name: "FCT - Fundacao para a Ciencia e a Tecnologia (Portugal)"
    url: "https://www.fct.pt/"
    description: |
      Financiamento para projetos de investigacao em ciencias humanas, digitais
      e patrimonio cultural. A Associacao MILK pode candidatar-se como entidade
      de investigacao sem fins lucrativos.
    eligibility: |
      - Entidades de investigacao registadas em Portugal
      - Projetos com impacto academico e social
      - Alinhamento com as prioridades nacionais de I&D
    deadline: "2026-11-30"
    budget: "EUR 50K - EUR 500K"

