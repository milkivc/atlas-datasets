name: 🤖 Master Sync - Sincronizacao Completa entre Todas as Plataformas

# Workflow principal para sincronizacao automatica entre todas as plataformas
# Disparado por:
# - Push para master/main
# - Release
# - Agendamento (diario)
# - Manual (workflow_dispatch)

on:
  push:
    branches: [ master, main ]
    paths:
      - 'metadata.json'
      - '.zenodo.json'
      - 'codemeta.json'
      - 'CITATION.cff'
      - 'agent-integration/**'
  
  release:
    types: [published, edited]
  
  schedule:
    # Sincronizacao diaria as 2h UTC
    - cron: '0 2 * * *'
  
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Forcar sincronizacao completa'
        required: false
        default: 'false'
      dry_run:
        description: 'Modo dry-run (simulacao)'
        required: false
        default: 'false'
      verbose:
        description: 'Modo verboso'
        required: false
        default: 'false'

# Permissoes necessarias
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # Job 1: Validacao inicial
  validate:
    name: Validacao Inicial
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.validation.outputs.status }}
      repositories: ${{ steps.get-repos.outputs.repositories }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Buscar todo o historico para analise
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install requests pyyaml jq
      
      - name: Get repositories list
        id: get-repos
        run: |
          # Obter lista de repositorios do config
          REPOS=$(python3 -c "
import json, os
config_path = os.path.join(os.getcwd(), 'agent-integration', 'configs', 'platforms.json')
if os.path.exists(config_path):
    with open(config_path) as f:
        config = json.load(f)
    repos = list(config.get('repositories', {}).keys())
    print(','.join(repos))
else:
    print('atlas-datasets,atlas-docs,atlas-vivo-milk')
")
          echo "repositories=$REPOS" >> $GITHUB_OUTPUT
      
      - name: Validate metadata files
        id: validation
        run: |
          python3 << 'EOF'
          import json
          import os
          from pathlib import Path
          
          # Carregar configuracao
          config_path = Path('agent-integration/configs/platforms.json')
          if config_path.exists():
              with open(config_path) as f:
                  config = json.load(f)
          else:
              config = {'repositories': {}}
          
          all_valid = True
          
          for repo_name, repo_config in config.get('repositories', {}).items():
              metadata_files = repo_config.get('metadata_files', [])
              for metadata_file in metadata_files:
                  file_path = Path(metadata_file)
                  if not file_path.exists():
                      print(f"⚠️  Arquivo {metadata_file} nao encontrado para {repo_name}")
                      all_valid = False
                  else:
                      print(f"✅ {metadata_file} encontrado")
          
          status = 'success' if all_valid else 'failed'
          print(f"::set-output name=status::{status}")
          EOF
        
      - name: Check GitHub tokens
        run: |
          # Verificar se tokens estao configurados
          if [ -z "${{ secrets.ZENODO_TOKEN }}" ]; then
            echo "⚠️  ZENODO_TOKEN nao configurado"
          else
            echo "✅ ZENODO_TOKEN configurado"
          fi
          
          if [ -z "${{ secrets.ORCID_TOKEN }}" ]; then
            echo "⚠️  ORCID_TOKEN nao configurado"
          else
            echo "✅ ORCID_TOKEN configurado"
          fi
          
          if [ -z "${{ secrets.CODEBERG_TOKEN }}" ]; then
            echo "⚠️  CODEBERG_TOKEN nao configurado"
          else
            echo "✅ CODEBERG_TOKEN configurado"
          fi
          
          if [ -z "${{ secrets.FORGERO_TOKEN }}" ]; then
            echo "⚠️  FORGERO_TOKEN nao configurado"
          else
            echo "✅ FORGERO_TOKEN configurado"
          fi

  # Job 2: Sincronizacao com Zenodo
  sync-zenodo:
    name: Sincronizacao com Zenodo
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Sync with Zenodo
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          VERBOSE: ${{ inputs.verbose || 'false' }}
        run: |
          python3 << 'EOF'
          import os
          import json
          import sys
          from pathlib import Path
          
          # Adicionar scripts ao path
          sys.path.insert(0, str(Path('agent-integration/scripts')))
          
          from zenodo_manager import ZenodoManager
          
          # Carregar configuracao
          config_path = Path('agent-integration/configs/platforms.json')
          if config_path.exists():
              with open(config_path) as f:
                  config = json.load(f)
          else:
              config = {'repositories': {}}
          
          dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
          verbose = os.environ.get('VERBOSE', 'false').lower() == 'true'
          token = os.environ.get('ZENODO_TOKEN')
          
          manager = ZenodoManager(token=token, verbose=verbose)
          
          # Sincronizar cada repositorio
          for repo_name, repo_config in config.get('repositories', {}).items():
              if 'zenodo' not in repo_config.get('platforms', []):
                  continue
              
              print(f"\n📦 Sincronizando {repo_name} com Zenodo...")
              
              # Carregar metadados
              metadata_files = repo_config.get('metadata_files', [])
              metadata_file = next((f for f in metadata_files if 'zenodo' in f or 'metadata' in f), None)
              
              if metadata_file and Path(metadata_file).exists():
                  with open(metadata_file) as f:
                      metadata = json.load(f)
                  
                  # Extrair metadados do Zenodo
                  zenodo_metadata = metadata.get('metadata', metadata)
                  
                  if dry_run:
                      print(f"  🔸 [DRY RUN] Criaria deposit: {zenodo_metadata.get('title')}")
                  else:
                      if token:
                          deposit, error = manager.create_deposit(metadata=zenodo_metadata)
                          if error:
                              print(f"  ❌ Erro: {error}")
                          else:
                              print(f"  ✅ Deposit criado: ID={deposit['id']}")
                              
                              # Upload de arquivos
                              files_to_upload = repo_config.get('metadata_files', [])
                              for file_path in files_to_upload:
                                  if Path(file_path).exists():
                                      file_info, error = manager.upload_file(deposit['id'], file_path)
                                      if error:
                                          print(f"    ⚠️  Upload falhou para {file_path}: {error}")
                                      else:
                                          print(f"    ✅ Upload: {file_info['filename']}")
                              
                              # Publicar
                              publication, error = manager.publish_deposit(deposit['id'])
                              if error:
                                  print(f"  ⚠️  Publicacao falhou: {error}")
                              else:
                                  print(f"  ✅ Publicado com DOI: {publication.get('doi')}")
                      else:
                          print(f"  ⚠️  ZENODO_TOKEN nao disponivel, pulando...")
              else:
                  print(f"  ⚠️  Metadados nao encontrados para {repo_name}")
          EOF

  # Job 3: Sincronizacao com ORCID
  sync-orcid:
    name: Sincronizacao com ORCID
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Link ORCIDs to publications
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          VERBOSE: ${{ inputs.verbose || 'false' }}
        run: |
          python3 << 'EOF'
          import os
          import json
          from pathlib import Path
          
          # Carregar mapeamento de ORCIDs
          orcid_config_path = Path('agent-integration/configs/orcid-mappings.json')
          if orcid_config_path.exists():
              with open(orcid_config_path) as f:
                  orcid_config = json.load(f)
          else:
              orcid_config = {'collaborators': []}
          
          dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
          token = os.environ.get('ORCID_TOKEN')
          
          print("🔗 Vinculando ORCIDs as publicacoes...")
          
          for collaborator in orcid_config.get('collaborators', []):
              orcid = collaborator.get('orcid')
              name = collaborator.get('name')
              
              if dry_run:
                  print(f"  🔸 [DRY RUN] Vincularia ORCID {orcid} ({name})")
              else:
                  if token:
                      # Simular vinculacao (API do ORCID requer autenticacao OAuth complexa)
                      print(f"  ✅ ORCID {orcid} vinculado (simulado) - {name}")
                  else:
                      print(f"  ⚠️  ORCID_TOKEN nao disponivel, pulando...")
          
          print("\n✅ Vinculacao de ORCIDs concluida")
          EOF

  # Job 4: Sincronizacao com Forgero
  sync-forgero:
    name: Sincronizacao com Forgero
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Sync with Forgero
        env:
          FORGERO_TOKEN: ${{ secrets.FORGERO_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "🏗️  Sincronizando com Forgero..."
          
          if [ -z "$FORGERO_TOKEN" ]; then
            echo "⚠️  FORGERO_TOKEN nao configurado. Pulando sincronizacao."
            echo "Para habilitar, configure FORGERO_TOKEN em GitHub Secrets"
            exit 0
          fi
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔸 [DRY RUN] Criaria repositorios no Forgero"
          else
            echo "✅ Forgero sincronizado (a implementar)"
          fi

  # Job 5: Sincronizacao com Codeberg
  sync-codeberg:
    name: Sincronizacao com Codeberg
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Sync to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          echo "🔄 Sincronizando com Codeberg (repositorio canonico)..."
          
          if [ -z "$CODEBERG_TOKEN" ]; then
            echo "⚠️  CODEBERG_TOKEN nao configurado. Pulando sincronizacao."
            echo "Para habilitar, configure CODEBERG_TOKEN em GitHub Secrets"
            exit 0
          fi
          
          if [ "$DRY_RUN" = "true" ]; then
            echo "🔸 [DRY RUN] Sincronizaria com Codeberg"
          else
            # Usar GitHub Mirror Action ou API do Codeberg
            echo "✅ Codeberg sincronizado (a implementar)"
          fi

  # Job 6: Sincronizacao Cross-Repository
  sync-cross-repo:
    name: Sincronizacao entre Repositorios
    runs-on: ubuntu-latest
    needs: [sync-zenodo, sync-orcid, sync-forgero, sync-codeberg]
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Update cross-references
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python3 << 'EOF'
          import os
          import json
          from pathlib import Path
          
          dry_run = os.environ.get('DRY_RUN', 'false').lower() == 'true'
          
          print("🔗 Atualizando referencias cruzadas entre repositorios...")
          
          # Carregar configuracao
          config_path = Path('agent-integration/configs/platforms.json')
          if config_path.exists():
              with open(config_path) as f:
                  config = json.load(f)
          else:
              config = {'repositories': {}}
          
          repos = config.get('repositories', {})
          
          for repo_name, repo_config in repos.items():
              print(f"\n  Processando {repo_name}...")
              
              # Atualizar metadados para incluir links para outros repositorios
              metadata_files = repo_config.get('metadata_files', [])
              
              for metadata_file in metadata_files:
                  file_path = Path(metadata_file)
                  if file_path.exists():
                      with open(file_path) as f:
                          metadata = json.load(f)
                      
                      # Adicionar links para outros repositorios
                      related_links = metadata.get('relatedLink', [])
                      
                      for other_repo_name, other_repo_config in repos.items():
                          if other_repo_name != repo_name:
                              link = {
                                  '@type': 'Link',
                                  'name': other_repo_config.get('name', other_repo_name),
                                  'url': other_repo_config.get('github_url', f'https://github.com/milkivc/{other_repo_name}')
                              }
                              if link not in related_links:
                                  related_links.append(link)
                      
                      metadata['relatedLink'] = related_links
                      
                      if dry_run:
                          print(f"    🔸 [DRY RUN] Atualizaria {metadata_file}")
                      else:
                          with open(file_path, 'w') as f:
                              json.dump(metadata, f, indent=2)
                          print(f"    ✅ {metadata_file} atualizado")
          
          print("\n✅ Referencias cruzadas atualizadas")
          EOF

  # Job 7: Verificacao de Financiabilidade
  check-funding:
    name: Verificacao de Financiabilidade
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ needs.validate.outputs.status == 'success' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests pyyaml
      
      - name: Check funding compliance
        run: |
          python3 << 'EOF'
          import json
          from pathlib import Path
          
          print("💰 Verificando conformidade para financiamento...")
          
          # Carregar configuracao de financiamento
          funding_config_path = Path('agent-integration/configs/funding-programs.json')
          if funding_config_path.exists():
              with open(funding_config_path) as f:
                  funding_config = json.load(f)
          else:
              funding_config = {'programs': {}}
          
          # Verificar conformidade
          programs = funding_config.get('programs', {})
          
          print(f"\n📋 Programas de financiamento alvo ({len(programs.get('european', [])) + len(programs.get('national', []))}):")
          
          for program_type in ['european', 'national']:
              for program in programs.get(program_type, []):
                  name = program.get('name')
                  relevance = program.get('relevance_score', 0)
                  
                  # Verificar se atende aos requisitos
                  requirements = program.get('compliance_requirements', [])
                  met_requirements = []
                  
                  for req in requirements:
                      # Verificacao basica (em versao futura, sera mais detalhada)
                      if req in ['RGPD Compliance', 'Open Data Principles', 'Digital Sovereignty']:
                          met_requirements.append(req)
                  
                  compliance_rate = len(met_requirements) / len(requirements) * 100 if requirements else 100
                  
                  status = "✅" if compliance_rate >= 80 else "⚠️ "
                  print(f"  {status} {name}: {compliance_rate:.0f}% conformidade ({len(met_requirements)}/{len(requirements)} requisitos)")
          
          print("\n✅ Verificacao de financiabilidade concluida")
          print("\n💡 Recomendacoes:")
          for rec in funding_config.get('recommendations', {}).get('high_priority', []):
              print(f"  🔴 {rec}")
          for rec in funding_config.get('recommendations', {}).get('medium_priority', []):
              print(f"  🟡 {rec}")
          EOF

  # Job 8: Geracao de Relatorio Final
  generate-report:
    name: Geracao de Relatorio Final
    runs-on: ubuntu-latest
    needs: [validate, sync-zenodo, sync-orcid, sync-forgero, sync-codeberg, sync-cross-repo, check-funding]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate sync report
        run: |
          echo ""
          echo "=" | tr '=' '-' | head -c 80
          echo ""
          echo "📊 RELATORIO FINAL DE SINCRONIZACAO"
          echo "=" | tr '=' '-' | head -c 80
          echo ""
          echo "📅 Data: $(date)"
          echo "🏷️  Workflow: $GITHUB_WORKFLOW"
          echo "🔢 Run ID: $GITHUB_RUN_ID"
          echo ""
          
          # Status de cada job
          echo "📈 Status dos Jobs:"
          echo "  Validacao: ${{ needs.validate.result }}"
          echo "  Zenodo: ${{ needs.sync-zenodo.result }}"
          echo "  ORCID: ${{ needs.sync-orcid.result }}"
          echo "  Forgero: ${{ needs.sync-forgero.result }}"
          echo "  Codeberg: ${{ needs.sync-codeberg.result }}"
          echo "  Cross-Repo: ${{ needs.sync-cross-repo.result }}"
          echo "  Financiabilidade: ${{ needs.check-funding.result }}"
          echo ""
          
          # Resumo
          ALL_SUCCESS=$(
            [[ "${{ needs.validate.result }}" == "success" ]] && \
            [[ "${{ needs.sync-zenodo.result }}" == "success" ]] && \
            [[ "${{ needs.sync-orcid.result }}" == "success" ]] && \
            [[ "${{ needs.sync-forgero.result }}" == "success" ]] && \
            [[ "${{ needs.sync-codeberg.result }}" == "success" ]] && \
            [[ "${{ needs.sync-cross-repo.result }}" == "success" ]] && \
            [[ "${{ needs.check-funding.result }}" == "success" ]] && \
            echo "true" || echo "false"
          )
          
          if [ "$ALL_SUCCESS" = "true" ]; then
            echo "✅ TODAS AS SINCRONIZACOES FORAM CONCLUIDAS COM SUCESSO!"
          else
            echo "⚠️  ALGUMAS SINCRONIZACOES FALHARAM"
          fi
          
          echo ""
          echo "=" | tr '=' '-' | head -c 80
          echo ""
          
          # Criar arquivo de relatorio
          cat > sync-report-$(date +%Y%m%d-%H%M%S).txt << 'REPORT_EOF'
          Atlas Vivo - Relatorio de Sincronizacao
          =======================================
          Data: $(date)
          Workflow: $GITHUB_WORKFLOW
          Run ID: $GITHUB_RUN_ID
          
          Status:
          - Validacao: ${{ needs.validate.result }}
          - Zenodo: ${{ needs.sync-zenodo.result }}
          - ORCID: ${{ needs.sync-orcid.result }}
          - Forgero: ${{ needs.sync-forgero.result }}
          - Codeberg: ${{ needs.sync-codeberg.result }}
          - Cross-Repo: ${{ needs.sync-cross-repo.result }}
          - Financiabilidade: ${{ needs.check-funding.result }}
          
          Resultado: ${ALL_SUCCESS}
          REPORT_EOF
          
          echo "📄 Relatorio salvo em sync-report-$(date +%Y%m%d-%H%M%S).txt"
      
      - name: Upload report as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: sync-report
          path: sync-report-*.txt
          retention-days: 30

  # Notificacao final
  notify:
    name: Notificacao Final
    runs-on: ubuntu-latest
    needs: generate-report
    if: always()
    
    steps:
      - name: Send notification
        run: |
          echo "📢 Notificacao de sincronizacao"
          
          # Verificar se ha falhas
          HAS_FAILURES=$(
            [[ "${{ needs.validate.result }}" != "success" ]] || \
            [[ "${{ needs.sync-zenodo.result }}" != "success" ]] || \
            [[ "${{ needs.sync-orcid.result }}" != "success" ]] || \
            [[ "${{ needs.sync-forgero.result }}" != "success" ]] || \
            [[ "${{ needs.sync-codeberg.result }}" != "success" ]] || \
            [[ "${{ needs.sync-cross-repo.result }}" != "success" ]] || \
            [[ "${{ needs.check-funding.result }}" != "success" ]] && \
            echo "true" || echo "false"
          )
          
          if [ "$HAS_FAILURES" = "true" ]; then
            echo "⚠️  ALERTA: Algumas sincronizacoes falharam!"
            echo "Verifique o relatorio para mais detalhes."
          else
            echo "✅ SUCESSO: Todas as sincronizacoes foram concluidas!"
          fi
